; Reference firmware for the ESP-12E (ESP8266).
;
; Why this exists: `sdk/c` builds the bytes, but a component nobody compiles and nobody runs is
; a document. This is the smallest firmware that proves the protocol against the real broker:
; claim, certificate, mutual TLS on 8883, shadow, commands, ack and typed refusals.
;
; What it is not: a certified device. The ESP8266 has no BLE (so the radar cannot pair it), no
; flash encryption (so the key is on a plain filesystem), and TLS 1.2 only. See README.md for
; what that costs and what an ESP32-S3 adds.
;
; Build:  pio run -d sdk/esp8266
; Flash:  pio run -d sdk/esp8266 -t upload
; Logs:   pio device monitor -b 115200

[platformio]
; Wi-Fi credentials, the pairing ticket and this device's identity, from an untracked copy of
; secrets.ini.example. Missing file: `pio run` fails on the interpolation below, which is the
; correct failure — it never compiles secrets in from somewhere else.
extra_configs = secrets.ini
default_envs = esp12e

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

; A device that cannot be updated over the air is not a device we can support, so the two-slot
; layout is on from the start. `esp12e` has 4 MB; the smaller slots are the price of that.
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
    -D HAVEN_ESP8266=1
    ; Merged in explicitly: an `extra_configs` file cannot redefine a list option the main file
    ; already sets — it is silently dropped, which cost an hour of "wifi: joining 9-char ssid".
    ${secrets.build_flags}
    ; BearSSL sizes the TLS handshake at compile time; mutual TLS with a client certificate
    ; needs the larger session buffers or the handshake dies with an allocation failure.
    -D BEARSSL_SSL_MAX_FRAGMENT_LENGTH=512
    -D BEARSSL_MAX_SESSIONS=2

; The protocol itself, from this repository. `lib_extra_dirs` makes PlatformIO treat `sdk/c`
; as a library (its `library.json` names it), so there is one implementation and a firmware bug
; cannot be fixed in two places. A `symlink://` dependency resolves relative to libdeps and
; fails; this does not.
lib_extra_dirs = ..

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8


monitor_speed = 115200
upload_speed = 460800
