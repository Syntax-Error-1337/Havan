[package]
name = "worker"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "worker"
path = "src/lib.rs"

[dev-dependencies]
sqlx.workspace = true

[[bin]]
name = "haven-worker"
path = "src/main.rs"

# The same maintenance the worker runs every six hours, on demand: for an operator whose disk is filling
# now, and for proving the job does what the docs say without waiting for a tick.
[[bin]]
name = "haven-telemetry-maintain"
path = "src/bin/telemetry_maintain.rs"

# The tier above the pods: one `PSUBSCRIBE home:* user:*` for the whole fleet, republishing each event to the
# pods that asked for its channel. It lives here because the worker is the process that is expected to run
# alone — a second copy of it is elected away, not duplicated.
[[bin]]
name = "haven-fanout"
path = "src/bin/fanout.rs"

[dependencies]
kernel.workspace = true
infra.workspace = true
haven-cert.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
domain.workspace = true
protocol.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
rumqttc.workspace = true
anyhow.workspace = true
uuid.workspace = true
redis.workspace = true
futures-util.workspace = true
