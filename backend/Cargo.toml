[workspace]
resolver = "3"
members = [
  "crates/protocol",
  "crates/kernel",
  "crates/domain",
  "crates/infra",
  "crates/api",
  "crates/worker",
  "crates/migrate",
  "crates/haven-sdk",
  "crates/simulator",
  "crates/devseed",
  "crates/haven-cert",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["Haven"]

[workspace.dependencies]
haven-sdk = { path = "crates/haven-sdk" }
protocol = { path = "crates/protocol" }
kernel = { path = "crates/kernel" }
domain = { path = "crates/domain" }
infra = { path = "crates/infra" }
haven-cert = { path = "crates/haven-cert" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8", features = ["macros", "ws"] }
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "limit", "compression-gzip"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
rumqttc = "0.24"
utoipa = { version = "5", features = ["axum_extras", "uuid", "time"] }
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
jsonwebtoken = "9"
# Certificate issuance. MIT/Apache-2.0, which is why it is allowed and openssl is not
# (openssl is Apache-2.0 for the crate but pulls a system library with its own history).
rcgen = { version = "0.13", features = ["x509-parser"] }
object_store = "0.11"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }

[profile.dev]
debug = "line-tables-only"   # a 20-crate workspace does not need full debuginfo
[profile.test]
debug = 0
[profile.dev.package."*"]
opt-level = 1
