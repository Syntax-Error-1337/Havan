# VerneMQ for Haven.
#
# A file rather than `DOCKER_VERNEMQ_*` environment variables because a *named* listener cannot be
# declared through them: `listener.ssl.constrained.*` breaks the image's config generator, which
# exits with "Error generating config with cuttlefish" and no further explanation. Named listeners
# are a file-only feature.

accept_eula = yes

# --- listeners -------------------------------------------------------------------------------
# 1883: plain MQTT. Loopback-only in compose. The workers and the simulator are inside the
# network; a device on Wi-Fi uses one of the TLS listeners below.
listener.tcp.default = 0.0.0.0:1883
allow_anonymous = off

# 8883: mutual TLS. The listener a certified device uses — a certificate signed by the device CA
# is the credential, and a client without one is refused at the handshake.
listener.ssl.default = 0.0.0.0:8883
listener.ssl.certfile = /certs/server.crt
listener.ssl.keyfile = /certs/server.key
listener.ssl.cafile = /certs/ca.pem
listener.ssl.require_certificate = on

# 8884: TLS with the same server certificate, and **no** client certificate. This exists because
# an ESP8266 cannot complete a mutual handshake in its heap: the client certificate and the chain
# verification together need more memory than the board has. A device on this listener
# authenticates at the MQTT layer instead, with its own serial and secret, and its own ACL — a
# weaker credential than a certificate, and a real one.
listener.ssl.constrained = 0.0.0.0:8884
listener.ssl.constrained.certfile = /certs/server.crt
listener.ssl.constrained.keyfile = /certs/server.key
listener.ssl.constrained.require_certificate = off

# The HTTP status listener is left at its default (`listener.http.metrics`). Declaring
# `listener.http.default` on the same port binds 8888 twice and the second listener dies with
# `eaddrinuse`, which looks like a port conflict from outside and is a config conflict inside.

# --- authorization ---------------------------------------------------------------------------
# Every connect, publish and subscribe is decided by the API, which knows the device, its home and
# its secret. Without this the 8884 listener authenticates nobody: a password is only a credential
# if something checks it.
#
# `host.docker.internal` is the machine's own address from inside the container. The token is a
# query parameter because `vmq_webhooks` cannot send headers — its schema offers a hook, an
# endpoint and a timeout, and nothing else. The `/v1` prefix is where the API nests every router.
plugins.vmq_webhooks = on

vmq_webhooks.register.hook = auth_on_register
vmq_webhooks.register.endpoint = http://host.docker.internal:8080/v1/internal/mqtt/register?token=dev-broker-hook-token

# Known gap, verified with the endpoint pointed at a dead port: VerneMQ 2.0.1 does not consult
# `auth_on_publish` or `auth_on_subscribe` here — a publish and a wildcard subscribe are both
# answered immediately whether these endpoints answer or not, while `auth_on_register` is
# consulted (a wrong device secret is refused). So the *credential* is enforced and the per-device
# topic ACL is not, which is why 8884 stays on loopback. The next thing to read is
# `vmq_webhooks`' hook registration in 2.0.1; `vmq_admin trace` and a dead endpoint both say the
# hook is never called.
vmq_webhooks.publish.hook = auth_on_publish
vmq_webhooks.publish.endpoint = http://host.docker.internal:8080/v1/internal/mqtt/authorize?token=dev-broker-hook-token

vmq_webhooks.subscribe.hook = auth_on_subscribe
vmq_webhooks.subscribe.endpoint = http://host.docker.internal:8080/v1/internal/mqtt/authorize?token=dev-broker-hook-token

# --- limits ----------------------------------------------------------------------------------
max_inflight_messages = 32
log.console.level = info
########## Start ##########
log.console=console
erlang.distribution.port_range.minimum = 9100
erlang.distribution.port_range.maximum = 9109
listener.tcp.default = 172.18.0.5:1883
listener.ws.default = 172.18.0.5:8080
listener.vmq.clustering = 172.18.0.5:44053
listener.http.metrics = 172.18.0.5:8888
########## End ##########
